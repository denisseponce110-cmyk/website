<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Denisse Ponce</title>
<meta name="description" content="Denisse Ponce — actor based in Toronto, ON. Resume, acting reels, and dance reels.">
<script>
  // GitHub Pages SPA redirect decode (https://github.com/rafgraph/spa-github-pages)
  (function () {
    var l = window.location;
    if (l.search[1] === '/') {
      var decoded = l.search.slice(1).split('&').map(function (s) {
        return s.replace(/~and~/g, '&');
      }).join('?');
      window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
    }
  })();
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
